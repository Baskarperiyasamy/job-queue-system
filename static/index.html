<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Job Processing Dashboard</title>
<style>
  :root {
    --bg: #121213;
    --card: #eef1f8;
    --border: #232b40;
    --text: #529be4;
    --muted: #8892a6;
    --accent: #424ba5;
    --green: #3ecf8e;
    --red: #f0616b;
    --amber: #f0b545;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .live-badge {
    background: rgba(62, 207, 142, 0.15);
    color: var(--green);
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 12px;
  }
  main { padding: 24px 28px; max-width: 1200px; margin: 0 auto; }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .stat-card .label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .stat-card .value {
    font-size: 26px;
    font-weight: 700;
    margin-top: 6px;
  }
  .columns {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 20px;
  }
  @media (max-width: 800px) {
    .columns { grid-template-columns: 1fr; }
  }
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
  }
  .panel h2 { font-size: 15px; margin: 0 0 16px; }
  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin: 12px 0 6px;
  }
  select, textarea, input {
    width: 100%;
    background: #0e1523;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 9px 10px;
    font-size: 13px;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 70px; font-family: monospace; }
  button {
    width: 100%;
    margin-top: 16px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 11px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left;
    color: var(--muted);
    font-weight: 500;
    font-size: 11px;
    text-transform: uppercase;
    padding: 8px 6px;
    border-bottom: 1px solid var(--border);
  }
  td { padding: 9px 6px; border-bottom: 1px solid var(--border); }
  .id-cell { font-family: monospace; color: var(--muted); }
  .badge {
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    display: inline-block;
  }
  .badge.pending { background: rgba(240,181,69,0.15); color: var(--amber); }
  .badge.running { background: rgba(124,134,240,0.15); color: var(--accent); }
  .badge.completed { background: rgba(62,207,142,0.15); color: var(--green); }
  .badge.failed { background: rgba(240,97,107,0.15); color: var(--red); }
  .badge.cancelled { background: rgba(136,146,166,0.15); color: var(--muted); }
  .cancel-btn {
    width: auto;
    margin: 0;
    padding: 4px 10px;
    font-size: 11px;
    background: transparent;
    border: 1px solid var(--red);
    color: var(--red);
  }
  .empty-row td { color: var(--muted); text-align: center; padding: 24px; }
  .error-msg { color: var(--red); font-size: 12px; margin-top: 8px; display: none; }
</style>
</head>
<body>

<header>
  <h1>Job Processing Dashboard</h1>
  <span class="live-badge">live</span>
</header>

<main>
  <div class="stats-grid" id="stats-grid"></div>

  <div class="columns">
    <div class="panel">
      <h2>Submit a job</h2>
      <label>Job type</label>
      <select id="job-type">
        <option value="file_processing">file_processing</option>
        <option value="data_transformation">data_transformation</option>
        <option value="email_sending">email_sending</option>
        <option value="report_generation">report_generation</option>
      </select>
      <label>Priority</label>
      <select id="priority">
        <option value="low">low</option>
        <option value="medium" selected>medium</option>
        <option value="high">high</option>
      </select>
      <label>Payload (JSON)</label>
      <textarea id="payload">{"duration": 3}</textarea>
      <button id="submit-btn" onclick="submitJob()">Submit job</button>
      <div class="error-msg" id="error-msg"></div>
    </div>

    <div class="panel">
      <h2>Recent jobs</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th><th>Type</th><th>Priority</th><th>Status</th><th>Retries</th><th>Duration</th><th></th>
          </tr>
        </thead>
        <tbody id="jobs-body">
          <tr class="empty-row"><td colspan="7">No jobs yet</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<script>
const STAT_LABELS = [
  ["total_jobs", "Total jobs"],
  ["pending", "Pending"],
  ["running", "Running"],
  ["completed", "Completed"],
  ["failed", "Failed"],
  ["cancelled", "Cancelled"],
  ["dead_letter", "Dead letter"],
];

async function refreshStats() {
  const res = await fetch("/api/dashboard/stats");
  const data = await res.json();
  const grid = document.getElementById("stats-grid");
  grid.innerHTML = "";

  const cards = STAT_LABELS.map(([key, label]) => [label, data[key]]);
  cards.push(["Queue length", data.queue.queue_size]);
  cards.push(["Avg time (s)", data.average_processing_time_seconds ?? "—"]);
  cards.push(["Success rate", data.success_rate_percent != null ? data.success_rate_percent + "%" : "—"]);

  for (const [label, value] of cards) {
    const card = document.createElement("div");
    card.className = "stat-card";
    card.innerHTML = `<div class="label">${label}</div><div class="value">${value}</div>`;
    grid.appendChild(card);
  }
}

async function refreshJobs() {
  const res = await fetch("/api/jobs?limit=15");
  const jobs = await res.json();
  const body = document.getElementById("jobs-body");

  if (jobs.length === 0) {
    body.innerHTML = `<tr class="empty-row"><td colspan="7">No jobs yet</td></tr>`;
    return;
  }

  body.innerHTML = jobs.map(j => `
    <tr>
      <td class="id-cell">${j.id.slice(0, 8)}...</td>
      <td>${j.job_type}</td>
      <td>${j.priority}</td>
      <td><span class="badge ${j.status}">${j.status}</span></td>
      <td>${j.retries}/${j.max_retries}</td>
      <td>${j.processing_time_seconds != null ? j.processing_time_seconds + "s" : "—"}</td>
      <td>${j.status === "pending" ? `<button class="cancel-btn" onclick="cancelJob('${j.id}')">Cancel</button>` : ""}</td>
    </tr>
  `).join("");
}

async function submitJob() {
  const btn = document.getElementById("submit-btn");
  const errorEl = document.getElementById("error-msg");
  errorEl.style.display = "none";

  let payload;
  try {
    payload = JSON.parse(document.getElementById("payload").value);
  } catch (e) {
    errorEl.textContent = "Payload must be valid JSON";
    errorEl.style.display = "block";
    return;
  }

  btn.disabled = true;
  try {
    const res = await fetch("/api/jobs", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        job_type: document.getElementById("job-type").value,
        priority: document.getElementById("priority").value,
        payload,
      }),
    });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || "Submission failed");
    }
    await refreshAll();
  } catch (e) {
    errorEl.textContent = e.message;
    errorEl.style.display = "block";
  } finally {
    btn.disabled = false;
  }
}

async function cancelJob(id) {
  await fetch(`/api/jobs/${id}`, { method: "DELETE" });
  await refreshAll();
}

async function refreshAll() {
  await Promise.all([refreshStats(), refreshJobs()]);
}

refreshAll();
setInterval(refreshAll, 2000);
</script>

</body>
</html>
